<!doctype html><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:transparent;pointer-events:none}canvas{display:block}</style><canvas></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let state={},particles=[],previous=null,burstStart=-1000;function resize(){const d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);particles=[];previous=null;}onresize=resize;resize();
window.paint=s=>{const now=performance.now();if(s.burst&&!state.burst)burstStart=now;const old=previous;state=s;if(old&&!s.reduce){const dx=s.x-old.x,dy=s.y-old.y,dist=Math.hypot(dx,dy);if(dist>1&&dist<120){const count=Math.min(4,Math.ceil(dist/6));for(let i=0;i<count;i++){const t=(i+1)/count;particles.push({x:old.x+dx*t+3,y:old.y+dy*t+7,born:now,r:1.3+Math.random()*1.4});}}}previous={x:s.x,y:s.y};particles=particles.slice(-36);};
function draw(now){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>now-p.born<130&&Math.hypot(p.x-state.x,p.y-state.y)<38);if(!state.reduce)for(const p of particles){const life=1-(now-p.born)/130;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.8);g.addColorStop(0,`rgba(71,161,255,${life*.75})`);g.addColorStop(1,'rgba(71,161,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.8,0,Math.PI*2);ctx.fill();}
const x=state.x+4,y=state.y+8;if(state.state==='pensando'||state.state==='analizando'){const r=10,a=state.reduce?.14:.14+.05*Math.sin(now/300),g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(63,154,255,${a})`);g.addColorStop(1,'rgba(63,154,255,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}const elapsed=now-burstStart;if(state.burst&&elapsed<240){const life=Math.pow(1-elapsed/240,2);ctx.save();ctx.translate(x,y);ctx.rotate(-.55);const g=ctx.createLinearGradient(-28,0,23,0);g.addColorStop(0,'rgba(30,120,255,0)');g.addColorStop(.45,`rgba(52,151,255,${life*.92})`);g.addColorStop(.58,`rgba(190,232,255,${life})`);g.addColorStop(1,'rgba(30,120,255,0)');ctx.shadowColor=`rgba(44,144,255,${life})`;ctx.shadowBlur=12;ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-28,-2);ctx.lineTo(-4,-6);ctx.lineTo(23,-1);ctx.lineTo(6,4);ctx.lineTo(-21,3);ctx.closePath();ctx.fill();ctx.restore();}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script>
