<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:transparent;pointer-events:none}#orb{position:absolute;left:63px;top:63px;width:54px;height:54px;transition:opacity .2s}img{width:54px;height:54px;object-fit:contain}#halo{position:absolute;inset:4px;border-radius:50%;box-shadow:0 0 13px #54aaff66}#trail{position:absolute;left:-31px;top:20px;width:63px;height:13px;background:linear-gradient(90deg,transparent,#71c8ff55);filter:blur(5px);opacity:0}#ring{position:absolute;inset:-3px;border:1px solid #3b9bff;border-radius:50%;display:none;animation:orbit 2s linear infinite}#dots{position:absolute;top:-7px;left:15px;color:#1674ed;font:18px sans-serif;display:none}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><div id="orb"><div id="halo"></div><div id="trail"></div><div id="ring"></div><div id="dots">···</div><img src="assets/cursor/ceramica.png"></div><script>window.paint=s=>{const o=document.getElementById('orb');document.getElementById('ring').style.animation=s.reduce?'none':'orbit 2s linear infinite';o.style.transform=`rotate(${s.angle}deg)`;o.style.opacity=s.state==='pausa'?.4:1;document.getElementById('trail').style.opacity=s.trail?1:0;document.getElementById('ring').style.display=s.state==='analizando'?'block':'none';document.getElementById('dots').style.display=s.state==='pensando'?'block':'none';};</script>
