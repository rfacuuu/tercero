<!doctype html><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:transparent;pointer-events:none}canvas{display:block}</style><canvas width="180" height="180"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let points=[],state={},last=performance.now(),burstStart=0;
window.paint=s=>{if(s.burst&&!state.burst)burstStart=performance.now();state=s;points=points.map(p=>({...p,x:p.x-(s.dx||0),y:p.y-(s.dy||0)}));if(s.trail&&!s.reduce)points.push({x:90,y:90,born:performance.now()});};
function draw(now){ctx.clearRect(0,0,180,180);points=points.filter(p=>now-p.born<360);const thinking=state.state==='pensando'||state.state==='analizando';if(!state.reduce){for(let i=1;i<points.length;i++){const p=points[i],q=points[i-1],life=1-(now-p.born)/360;const g=ctx.createLinearGradient(q.x,q.y,p.x,p.y);g.addColorStop(0,`rgba(30,95,230,${life*.08})`);g.addColorStop(1,`rgba(80,180,255,${life*.25})`);ctx.strokeStyle=g;ctx.lineWidth=2+life*5;ctx.lineCap='round';ctx.shadowColor='#4eaaff';ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(q.x+4,q.y+8);ctx.lineTo(p.x+4,p.y+8);ctx.stroke();}}
ctx.shadowBlur=0;if(thinking){const a=state.reduce?.12:.10+.06*Math.sin(now/350);const g=ctx.createRadialGradient(95,100,1,95,100,15);g.addColorStop(0,`rgba(73,160,255,${a})`);g.addColorStop(1,'rgba(73,160,255,0)');ctx.fillStyle=g;ctx.fillRect(78,83,34,34);}
const elapsed=now-burstStart;if(state.burst&&elapsed<850){const life=1-elapsed/850,r=state.reduce?16:8+elapsed/38;ctx.beginPath();ctx.arc(93,97,r,0,Math.PI*2);ctx.strokeStyle=`rgba(68,155,255,${life*.4})`;ctx.lineWidth=1.4;ctx.stroke();const g=ctx.createRadialGradient(93,97,0,93,97,r);g.addColorStop(0,`rgba(100,195,255,${life*.17})`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fill();}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script>
