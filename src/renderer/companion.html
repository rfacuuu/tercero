<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:transparent;overflow:hidden;pointer-events:none}#effect{position:absolute;left:90px;top:90px;width:1px;height:1px}#glow{position:absolute;width:30px;height:30px;left:-8px;top:1px;background:radial-gradient(ellipse,#62b9ff55,transparent 70%);filter:blur(3px)}#trail{position:absolute;right:3px;top:2px;width:40px;height:14px;transform-origin:100% 50%;background:linear-gradient(90deg,transparent,#238bff44,#a4dcff66);filter:blur(4px);border-radius:100%}body.thinking #glow{width:31px;height:31px;left:-8px;top:0px;background:radial-gradient(ellipse,#58afff44,transparent 70%);animation:breathe 1.7s ease-in-out infinite}@keyframes breathe{50%{opacity:.4}}body.reduce *{animation:none!important}</style><div id="effect"><div id="glow"></div><div id="trail"></div></div><script>window.paint=s=>{document.body.classList.toggle('thinking',s.state==='pensando'||s.state==='analizando');document.body.classList.toggle('reduce',!!s.reduce);const trail=document.getElementById('trail');trail.style.opacity=s.trail?'1':'0';trail.style.transform=`rotate(${s.angle}deg)`;};</script>
