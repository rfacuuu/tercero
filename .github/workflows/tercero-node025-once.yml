name: Tercero Windows Node worker validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap and native updater, no user data
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'fixture025.zip'
          [IO.File]::WriteAllBytes($p,[Convert]::FromBase64String(''))
          $d=Join-Path $env:RUNNER_TEMP 'fixture025'
          Expand-Archive $p $d
          & "$d/run.ps1"
