name: Tercero GitHub BAT Windows validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native external BAT with private GitHub and rollback
        shell: pwsh
        env:
          GH_REPO_TOKEN: ${{ github.token }}
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'git-bat-fixture.zip'
          [IO.File]::WriteAllBytes($p,[Convert]::FromBase64String(''))
          $d=Join-Path $env:RUNNER_TEMP 'git-bat-fixture'
          Expand-Archive $p $d
          & "$d/run.ps1"
