name: Tercero Windows validation (one authorized run)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Native updater fixture, no user data
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'fixture.zip'
          [IO.File]::WriteAllBytes($p,[Convert]::FromBase64String(''))
          $d=Join-Path $env:RUNNER_TEMP 'fixture'
          Expand-Archive $p $d
          & "$d/run.ps1"
